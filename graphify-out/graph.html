<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GistMyMail — Architecture Knowledge Graph | Graphify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
        integrity="sha384-Ux6phic9PEHJ38YtrijhkzyJ8yQlH8i/+buBR8s3mAZOJrP1gwyvAcIYl3GWtpX1"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg-base: #060911;
    --bg-surface: rgba(13, 19, 36, 0.78);
    --bg-card: rgba(20, 29, 54, 0.7);
    --bg-card-hover: rgba(30, 42, 74, 0.85);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-focus: rgba(99, 102, 241, 0.6);
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.35);
    --cyan: #06b6d4;
    --emerald: #10b981;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-ui);
    display: flex;
    height: 100vh;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  /* Ambient background spotlight & cyber grid */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

  /* Top Navigation Deck */
  #top-deck {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 376px;
    height: 52px;
    background: var(--bg-surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  }

  .deck-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-orb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 12px var(--emerald);
    animation: pulseOrb 2.5s infinite;
  }

  @keyframes pulseOrb {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(99, 102, 241, 0.2);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: var(--accent-light);
  }

  .deck-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.3);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  .nav-pill {
    padding: 5px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-pill:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.06);
  }

  .nav-pill.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .deck-stats {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 4px 9px;
    border-radius: 7px;
  }

  .stat-chip strong {
    color: var(--text-primary);
    font-family: var(--font-mono);
  }

  /* Main Graph Canvas Container */
  #graph {
    flex: 1;
    height: 100vh;
    z-index: 1;
  }

  /* Floating Canvas Tool Dock */
  #graph-controls {
    position: absolute;
    bottom: 24px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 90;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.15);
  }

  .tool-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-light);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .tool-divider {
    width: 1px;
    height: 20px;
    background: var(--border-subtle);
    margin: 0 2px;
  }

  /* Sidebar Design */
  #sidebar {
    width: 350px;
    background: var(--bg-surface);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
  }

  /* Search Section */
  #search-wrap {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }

  .search-input-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: rgba(8, 12, 22, 0.7);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 9px 38px 9px 34px;
    border-radius: 10px;
    font-family: var(--font-ui);
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
  }

  #search:focus {
    border-color: var(--accent-light);
    background: rgba(8, 12, 22, 0.95);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-shortcut {
    position: absolute;
    right: 10px;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.07);
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  #search-results {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 8px;
    background: rgba(10, 15, 29, 0.95);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 4px;
    display: none;
  }

  .search-item {
    padding: 7px 10px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.12s ease;
  }

  .search-item:hover {
    background: rgba(99, 102, 241, 0.18);
  }

  .search-item-label {
    font-family: var(--font-mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-item-badge {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Node Info Panel */
  #info-panel {
    padding: 16px 14px;
    border-bottom: 1px solid var(--border-subtle);
    min-height: 160px;
    background: rgba(255, 255, 255, 0.015);
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .panel-header h3 {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .clear-focus-btn {
    font-size: 10.5px;
    color: var(--accent-light);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .clear-focus-btn:hover {
    background: rgba(99, 102, 241, 0.15);
  }

  #info-content {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .info-empty {
    text-align: center;
    padding: 22px 10px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .info-empty-icon {
    font-size: 24px;
    margin-bottom: 8px;
    opacity: 0.5;
  }

  .node-title-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }

  .node-title-card .node-label {
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    word-break: break-all;
    margin-bottom: 6px;
  }

  .node-pill-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .node-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .node-pill strong {
    color: var(--text-primary);
  }

  .node-source-row {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .node-source-path {
    font-family: var(--font-mono);
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
  }

  #neighbors-list {
    max-height: 180px;
    overflow-y: auto;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .neighbor-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11.5px;
    font-family: var(--font-mono);
    background: rgba(255, 255, 255, 0.02);
    border-left: 3px solid #555;
    transition: all 0.12s ease;
  }

  .neighbor-link:hover {
    background: var(--bg-card-hover);
    padding-left: 11px;
  }

  /* Legend & Communities Section */
  #legend-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }

  .legend-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .legend-header h3 {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  #legend-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  #legend-controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  #legend-controls label:hover {
    color: var(--text-primary);
  }

  .legend-actions {
    display: flex;
    gap: 6px;
  }

  .legend-action-btn {
    font-size: 10.5px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .legend-action-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.06);
  }

  .legend-cb, #select-all-cb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.3);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.12s ease;
  }

  .legend-cb:checked, #select-all-cb:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .legend-cb:checked::after, #select-all-cb:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1.5px;
    width: 3.5px;
    height: 6.5px;
    border: solid #fff;
    border-width: 0 1.8px 1.8px 0;
    transform: rotate(45deg);
  }

  #select-all-cb:indeterminate {
    background: var(--accent);
    border-color: var(--accent);
  }

  #select-all-cb:indeterminate::after {
    content: '';
    position: absolute;
    left: 2.5px;
    top: 5px;
    width: 7px;
    height: 2px;
    background: #fff;
  }

  #legend {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 7px;
    font-size: 12px;
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid transparent;
    transition: all 0.15s ease;
  }

  .legend-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.06);
  }

  .legend-item.dimmed {
    opacity: 0.3;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }

  .legend-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
  }

  .legend-item:hover .legend-label {
    color: var(--text-primary);
  }

  .legend-count {
    color: var(--text-muted);
    font-size: 11px;
    font-family: var(--font-mono);
    background: rgba(0, 0, 0, 0.25);
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* Stats Footer */
  #stats {
    padding: 12px 14px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.2);
  }

  .stats-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--emerald);
    margin-right: 5px;
  }
</style>
</head>
<body>

<!-- Top Navigation & Metrics Bar -->
<div id="top-deck">
  <div class="deck-brand">
    <div class="brand-orb"></div>
    <div class="brand-title">
      GistMyMail
      <span class="brand-badge">Hack Day Jaipur 2026</span>
    </div>
  </div>

  <div class="deck-nav">
    <a href="graph.html" class="nav-pill active">🌐 Network Graph</a>
    <a href="Gistmymail-callflow.html" class="nav-pill">🔀 Architecture Callflow</a>
    <a href="GRAPH_TREE.html" class="nav-pill">🌳 Hierarchy Tree</a>
  </div>

  <div class="deck-stats">
    <div class="stat-chip">Nodes: <strong>322</strong></div>
    <div class="stat-chip">Edges: <strong>477</strong></div>
    <div class="stat-chip">Clusters: <strong>20</strong></div>
  </div>
</div>

<!-- Graph Canvas -->
<div id="graph"></div>

<!-- Floating Action Dock -->
<div id="graph-controls">
  <button class="tool-btn" id="fit-btn" title="Fit Network (Space)">⛶</button>
  <button class="tool-btn" id="zoom-in-btn" title="Zoom In (+)">➕</button>
  <button class="tool-btn" id="zoom-out-btn" title="Zoom Out (-)">➖</button>
  <div class="tool-divider"></div>
  <button class="tool-btn active" id="physics-btn" title="Toggle Physics (P)">⚡</button>
  <button class="tool-btn" id="reset-focus-btn" title="Reset Highlight (Esc)">↺</button>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="search-wrap">
    <div class="search-input-box">
      <span class="search-icon">🔍</span>
      <input id="search" type="text" placeholder="Search files, functions, classes..." autocomplete="off">
      <span class="search-shortcut">/</span>
    </div>
    <div id="search-results"></div>
  </div>

  <div id="info-panel">
    <div class="panel-header">
      <h3>Node Inspector</h3>
      <button class="clear-focus-btn" id="clear-inspect-btn">Reset</button>
    </div>
    <div id="info-content">
      <div class="info-empty">
        <div class="info-empty-icon">🔮</div>
        <div>Click any node or search above to inspect architectural relationships</div>
      </div>
    </div>
  </div>

  <div id="legend-wrap">
    <div class="legend-header">
      <h3>Architectural Communities</h3>
    </div>
    <div id="legend-controls">
      <label>
        <input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)">
        <span>Select All</span>
      </label>
      <div class="legend-actions">
        <button class="legend-action-btn" onclick="toggleAllCommunities(false)">All</button>
        <button class="legend-action-btn" onclick="toggleAllCommunities(true)">None</button>
      </div>
    </div>
    <div id="legend"></div>
  </div>

  <div id="stats">
    <span><span class="stats-dot"></span>Graphify AST Engine</span>
    <span>v0.5.4</span>
  </div>

(function initLegend() {

    const cid = n.community !== undefined ? n.community : 0;
    const name = n.community_name || `Community ${cid}`;

    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -75,
      centralGravity: 0.006,
      springLength: 130,
      springConstant: 0.07,
      damping: 0.45,
      avoidOverlap: 0.85
    },
    stabilization: { iterations: 180, fit: true }
  },
  interaction: {
    hover: true,
    tooltipDelay: 120,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
    zoomView: true
  },
  nodes: {
    shape: 'dot',
    borderWidth: 1.5,
    shadow: { enabled: true, color: 'rgba(0, 0, 0, 0.45)', size: 8, x: 0, y: 3 }
  },
  edges: {
    smooth: { type: 'continuous', roundness: 0.25 },
    selectionWidth: 3
  }
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
  isPhysicsActive = false;
  const pBtn = document.getElementById('physics-btn');
  if (pBtn) pBtn.classList.remove('active');
});

// Smart Focus and Dimming Engine
let currentFocusedNodeId = null;

function applyFocusHighlight(nodeId) {
  currentFocusedNodeId = nodeId;
  const connectedNodeIds = new Set(network.getConnectedNodes(nodeId));
  connectedNodeIds.add(nodeId);

  const connectedEdgeIds = new Set(network.getConnectedEdges(nodeId));

  // Dim unrelated nodes and highlight active cluster
  const nodeUpdates = nodesDS.map(n => {
    const isTarget = n.id === nodeId;
    const isNeighbor = connectedNodeIds.has(n.id);
    if (isTarget) {
      return {
        id: n.id,
        color: { background: n._origColor.background, border: '#ffffff', highlight: { background: '#ffffff', border: n._origColor.background } },
        size: n._origSize * 1.35,
        opacity: 1
      };
    } else if (isNeighbor) {
      return {
        id: n.id,
        color: { background: n._origColor.background, border: 'rgba(255, 255, 255, 0.8)', highlight: { background: '#ffffff', border: n._origColor.background } },
        size: n._origSize * 1.1,
        opacity: 0.95
      };
    } else {
      return {
        id: n.id,
        color: { background: 'rgba(50, 60, 85, 0.18)', border: 'rgba(255, 255, 255, 0.05)' },
        size: Math.max(5, n._origSize * 0.7),
        opacity: 0.15
      };
    }
  });
  nodesDS.update(nodeUpdates);

  // Dim unrelated edges and brighten direct connections
  const edgeUpdates = edgesDS.map(e => {
    if (connectedEdgeIds.has(e.id)) {
      return {
        id: e.id,
        color: { color: '#818cf8', highlight: '#c084fc' },
        width: 2.8,
        opacity: 1
      };
    } else {
      return {
        id: e.id,
        color: { color: 'rgba(255, 255, 255, 0.02)' },
        width: 0.6,
        opacity: 0.04
      };
    }
  });
  edgesDS.update(edgeUpdates);
}

function clearFocusHighlight() {
  currentFocusedNodeId = null;
  const nodeUpdates = nodesDS.map(n => ({
    id: n.id,
    color: {
      background: n._origColor.background,
      border: 'rgba(255, 255, 255, 0.4)',
      highlight: { background: '#ffffff', border: n._origColor.background }
    },
    size: n._origSize,
    opacity: 1
  }));
  nodesDS.update(nodeUpdates);

  const edgeUpdates = edgesDS.map(e => ({
    id: e.id,
    color: { color: e._origColor, highlight: '#818cf8', hover: '#38bdf8' },
    width: e._origWidth,
    opacity: 0.65
  }));
  edgesDS.update(edgeUpdates);

  document.getElementById('info-content').innerHTML = `
    <div class="info-empty">
      <div class="info-empty-icon">🔮</div>
      <div>Click any node or search above to inspect architectural relationships</div>
    </div>
  `;
}

// Node Inspector Display
function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  applyFocusHighlight(nodeId);

  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = (nb && nb._origColor) ? nb._origColor.background : '#6366f1';
    const label = nb ? nb.label : nid;
    const deg = (nb && nb._degree) ? ` (${nb._degree})` : '';
    return `<div class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}">
      <span>${esc(label)}</span>
      <span style="opacity:0.5;font-size:10px">${esc(deg)}</span>
    </div>`;
  }).join('');

  const srcFile = n._source_file || '-';
  const fileType = (n._file_type || 'code').toUpperCase();
  const commColor = (n._origColor && n._origColor.background) ? n._origColor.background : '#6366f1';

  document.getElementById('info-content').innerHTML = `
    <div class="node-title-card">
      <div class="node-label">${esc(n.label)}</div>
      <div class="node-pill-grid">
        <span class="node-pill" style="border-color:${esc(commColor)};">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${esc(commColor)};box-shadow:0 0 6px ${esc(commColor)};"></span>
          ${esc(n._community_name)}
        </span>
        <span class="node-pill">Type: <strong>${esc(fileType)}</strong></span>
        <span class="node-pill">Degree: <strong>${n._degree}</strong></span>
      </div>
      <div class="node-source-row">
        <span class="node-source-path" title="${esc(srcFile)}">${esc(srcFile)}</span>
        <button class="copy-btn" id="copy-path-btn" onclick="copyFilePath('${esc(srcFile)}')">Copy</button>
      </div>
    </div>
    ${neighborIds.length ? `
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:10px;margin-bottom:4px;">
        Connected Neighbors (${neighborIds.length})
      </div>
      <div id="neighbors-list">${neighborItems}</div>
    ` : ''}
  `;
}

function copyFilePath(path) {
  navigator.clipboard.writeText(path).then(() => {
    const btn = document.getElementById('copy-path-btn');
    if (btn) {
      btn.textContent = '✓ Copied';
      setTimeout(() => { if (btn) btn.textContent = 'Copy'; }, 1500);
    }
  }).catch(() => {});
}

function focusNode(nodeId) {
  network.focus(nodeId, {
    scale: 1.5,
    animation: { duration: 600, easingFunction: 'easeInOutQuad' }
  });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Delegated neighbor click handler
document.addEventListener('click', e => {
  const el = e.target.closest('.neighbor-link');
  if (el && el.dataset.nid !== undefined) {
    focusNode(el.dataset.nid);
  }
});

// Canvas node click and hover interactions
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});

container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    focusNode(hoveredNodeId);
  }
});

network.on('click', params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    clearFocusHighlight();
  }
});

// Dock & Toolbar Controls
document.getElementById('fit-btn').addEventListener('click', () => {
  network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
});

document.getElementById('zoom-in-btn').addEventListener('click', () => {
  network.moveTo({ scale: network.getScale() * 1.35, animation: { duration: 250 } });
});

document.getElementById('zoom-out-btn').addEventListener('click', () => {
  network.moveTo({ scale: network.getScale() / 1.35, animation: { duration: 250 } });
});

const physicsBtn = document.getElementById('physics-btn');
physicsBtn.addEventListener('click', () => {
  isPhysicsActive = !isPhysicsActive;
  network.setOptions({ physics: { enabled: isPhysicsActive } });
  if (isPhysicsActive) {
    physicsBtn.classList.add('active');
  } else {
    physicsBtn.classList.remove('active');
  }
});

document.getElementById('reset-focus-btn').addEventListener('click', () => {
  clearFocusHighlight();
  network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
});

document.getElementById('clear-inspect-btn').addEventListener('click', () => {
  clearFocusHighlight();
});

// Keyboard Shortcuts: Space (fit), Esc (clear focus), / (search), P (physics)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') {
      document.getElementById('search-results').style.display = 'none';
      document.getElementById('search').blur();
    }
    return;
  }
  if (e.key === '/') {
    e.preventDefault();
    document.getElementById('search').focus();
  } else if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  } else if (e.key === 'Escape') {
    clearFocusHighlight();
  } else if (e.key === 'p' || e.key === 'P') {
    physicsBtn.click();
  }
});

// Search Autocomplete with Type Badges
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q) || (n.source_file && n.source_file.toLowerCase().includes(q))).slice(0, 18);
  if (!matches.length) {
    searchResults.innerHTML = '<div style="padding:8px 10px;font-size:12px;color:var(--text-muted);text-align:center;">No matching architecture nodes</div>';
    searchResults.style.display = 'block';
    return;
  }

  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    const color = (n.color && n.color.background) ? n.color.background : '#6366f1';
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;overflow:hidden;">
        <span style="width:8px;height:8px;border-radius:50%;background:${esc(color)};flex-shrink:0;"></span>
        <span class="search-item-label">${esc(n.label)}</span>
      </div>
      <span class="search-item-badge">deg: ${n.degree || 0}</span>
    `;
    el.onclick = () => {
      focusNode(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = 'none';
  }
});

// Communities Filter & Isolation
const hiddenCommunities = new Set();
const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;

  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });

  item.innerHTML = `
    <div class="legend-dot" style="background:${esc(c.color)};color:${esc(c.color)}"></div>
    <span class="legend-label" title="${esc(c.label)}">${esc(c.label)}</span>
    <span class="legend-count">${c.count}</span>
  `;
  item.prepend(cb);

  // Clicking the label isolates that community and frames it in camera
  item.onclick = (e) => {
    if (e.target === cb) return;
    const commNodeIds = RAW_NODES.filter(n => n.community === c.cid).map(n => n.id);
    if (commNodeIds.length > 0) {
      network.fit({
        nodes: commNodeIds,
        animation: { duration: 600, easingFunction: 'easeInOutQuad' }
      });
      // Highlight the first or highest degree node in community
      const topNode = RAW_NODES.filter(n => n.community === c.cid).sort((a,b)=>(b.degree||0)-(a.degree||0))[0];
      if (topNode) showInfo(topNode.id);
    }
  };

  legendEl.appendChild(item);
});
</script>

<script>
// Render hyperedges as shaded regions
const hyperedges = [];
network.on('afterDrawing', function(ctx) {
  hyperedges.forEach(h => {
    const positions = h.nodes
      .map(nid => network.getPositions([nid])[nid])
      .filter(p => p !== undefined);
    if (positions.length < 2) return;
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#6366f1';
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
    const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
    const expanded = positions.map(p => ({
      x: cx + (p.x - cx) * 1.15,
      y: cy + (p.y - cy) * 1.15
    }));
    ctx.moveTo(expanded[0].x, expanded[0].y);
    expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#4f46e5';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(h.label, cx, cy - 5);
    ctx.restore();
  });
});
</script>
</body>
