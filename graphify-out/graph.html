<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GistMyMail — Architecture Knowledge Graph | Graphify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #060911;
    --bg-surface: rgba(14, 20, 36, 0.72);
    --bg-surface-elevated: rgba(22, 32, 58, 0.85);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(99, 102, 241, 0.35);
    --primary: #6366f1;
    --primary-light: #818cf8;
    --accent: #06b6d4;
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    position: relative;
    letter-spacing: -0.01em;
  }

  /* Cyber backdrop glows */
  body::before {
    content: '';
    position: absolute;
    top: -20%;
    left: 10%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(6, 9, 17, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: absolute;
    bottom: -15%;
    right: 15%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, rgba(6, 9, 17, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top Unified App Deck */
  #top-deck {
    height: 56px;
    background: rgba(10, 15, 29, 0.82);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 50;
    position: relative;
  }

  .deck-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo-badge {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px rgba(99, 102, 241, 0.45);
    font-weight: 800;
    font-size: 14px;
    color: #fff;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 9999px;
    background: rgba(99, 102, 241, 0.18);
    color: #a5b4fc;
    border: 1px solid rgba(99, 102, 241, 0.3);
    letter-spacing: 0.03em;
  }

  .deck-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-pill {
    padding: 6px 13px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-pill:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
  }

  .nav-pill.active {
    background: rgba(99, 102, 241, 0.16);
    color: #c7d2fe;
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
  }

  .deck-metrics {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .metric-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: rgba(15, 23, 42, 0.6);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
  }

  .metric-chip b {
    color: #fff;
    font-weight: 600;
  }

  /* Main Workspace */
  #workspace {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
    z-index: 10;
  }

  #graph {
    flex: 1;
    height: 100%;
    cursor: grab;
  }

  #graph:active {
    cursor: grabbing;
  }

  /* Glass Floating Canvas Dock */
  #graph-controls {
    position: absolute;
    bottom: 24px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    z-index: 30;
  }

  .dock-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
  }

  .dock-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.1);
  }

  .dock-btn.active {
    color: var(--accent);
    background: rgba(6, 182, 212, 0.15);
    border-color: rgba(6, 182, 212, 0.3);
  }

  /* Sidebar Design */
  #sidebar {
    width: 340px;
    background: rgba(11, 17, 33, 0.85);
    backdrop-filter: blur(24px);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 40;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.3);
  }

  #search-wrap {
    padding: 16px;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }

  .search-inner {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    padding: 9px 12px 9px 34px;
    border-radius: 9px;
    font-size: 13px;
    font-family: var(--font-ui);
    outline: none;
    transition: all 0.2s ease;
  }

  #search:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
    background: rgba(20, 29, 53, 0.95);
  }

  #search-results {
    max-height: 180px;
    overflow-y: auto;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-subtle);
    display: none;
    background: rgba(15, 23, 42, 0.95);
  }

  .search-item {
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-item:hover {
    background: rgba(99, 102, 241, 0.18);
    color: #fff;
    padding-left: 10px;
  }

  /* Node Inspector Panel */
  #info-panel {
    padding: 16px;
    border-bottom: 1px solid var(--border-subtle);
    min-height: 160px;
    overflow-y: auto;
  }

  .panel-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .panel-badge {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
  }

  #info-content {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .node-headline {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
    word-break: break-all;
  }

  .node-type-pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    font-family: var(--font-mono);
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .type-code { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
  .type-concept { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

  .field-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .field-label {
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .field-value {
    color: var(--text-primary);
    font-family: var(--font-mono);
    word-break: break-all;
  }

  .file-badge-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-top: 4px;
  }

  .copy-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .copy-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
  }

  #neighbors-list {
    max-height: 140px;
    overflow-y: auto;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .neighbor-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-secondary);
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid transparent;
    transition: all 0.15s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .neighbor-link:hover {
    background: rgba(99, 102, 241, 0.15);
    color: #fff;
    border-color: rgba(99, 102, 241, 0.3);
  }

  /* Legend & Communities Section */
  #legend-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  #legend-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  #legend-controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    user-select: none;
  }

  .legend-cb, #select-all-cb {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.8);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .legend-cb:checked, #select-all-cb:checked {
    background: var(--primary);
    border-color: var(--primary);
  }

  .legend-cb:checked::after, #select-all-cb:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  #legend {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }

  .legend-item:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
  }

  .legend-item.dimmed {
    opacity: 0.3;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }

  .legend-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }

  .legend-count {
    color: var(--text-muted);
    font-size: 11px;
    font-family: var(--font-mono);
  }

  #sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(8, 12, 24, 0.6);
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
  }
</style>
</head>

<div id="top-deck">
  <div class="deck-brand">
    <div class="brand-logo-badge">G</div>

      GistMyMail
      <span class="brand-tag">Hack Day Jaipur 2026</span>

  <!-- Floating Canvas Dock -->
  <div id="graph-controls">

  <!-- Sidebar -->
  <div id="sidebar">

      <div class="search-inner">

    <div id="info-panel">
      <div class="panel-header-row">
        <div class="panel-title">Node Inspector</div>
        <div class="panel-badge" id="inspector-badge">READY</div>

      <div id="info-content">
        <span style="color: var(--text-muted); font-style: italic;">Select any node on the graph to inspect imports, callers, and source origins.</span>
      </div>

    <div id="legend-wrap">
      <div id="legend-controls">
        <label><input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)"> Subsystem Clusters</label>
        <span class="panel-badge" id="cluster-total-badge">21 Total</span>
      </div>
      <div id="legend"></div>
    </div>

    <div id="sidebar-footer">
      <span>Graphify AST Engine</span>
      <span style="font-family: var(--font-mono);">395 N · 549 E</span>
    </div>
  </div>
</div>

const LEGEND = [];

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build Vis.js DataSets with original color retention for dimming
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id,
  label: n.label,
  color: n.color,
  size: n.size,
  font: {
    color: '#f8fafc',
    face: 'Plus Jakarta Sans',
    size: n.font?.size || 12,
    strokeWidth: 2,
    strokeColor: '#060911'
  },
  title: n.title,
  _origColor: n.color,
  _origSize: n.size,
  _community: n.community,
  _community_name: n.community_name || 'Cluster ' + n.community,
  _source_file: n.source_file,
  _file_type: n.file_type,
  _degree: n.degree
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i,
  from: e.from,
  to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width || 1,
  color: e.color || 'rgba(99, 102, 241, 0.25)',
  _origWidth: e.width || 1,
  _origColor: e.color || 'rgba(99, 102, 241, 0.25)',
  arrows: { to: { enabled: true, scaleFactor: 0.6 } }
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -70,
      centralGravity: 0.006,
      springLength: 130,
      springConstant: 0.08,
      damping: 0.45,
      avoidOverlap: 0.85
    },
    stabilization: { iterations: 180, fit: true }
  },
  interaction: {
    hover: true,
    tooltipDelay: 120,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false
  },
  nodes: {
    shape: 'dot',
    borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 10, x: 0, y: 4 }
  },
  edges: {
    smooth: { type: 'continuous', roundness: 0.2 },
    selectionWidth: 3
  }
});

let physicsActive = true;
network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
  physicsActive = false;
  const btn = document.getElementById('physics-toggle');
  if (btn) btn.classList.remove('active');
});

function togglePhysics() {
  physicsActive = !physicsActive;
  network.setOptions({ physics: { enabled: physicsActive } });
  const btn = document.getElementById('physics-toggle');
  if (btn) btn.classList.toggle('active', physicsActive);
}

function fitNetwork() {
  network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
}

function zoomIn() {
  const scale = network.getScale() * 1.3;
  network.moveTo({ scale, animation: { duration: 300 } });
}

function zoomOut() {
  const scale = network.getScale() * 0.7;
  network.moveTo({ scale, animation: { duration: 300 } });
}

function resetFocus() {
  resetDimming();
  document.getElementById('info-content').innerHTML = '<span style="color: var(--text-muted); font-style: italic;">Select any node on the graph to inspect imports, callers, and source origins.</span>';
  document.getElementById('inspector-badge').textContent = 'READY';
  fitNetwork();
}

// Smart Focus/Dimming Engine
function applyFocusHighlight(focusedNodeId) {
  const connectedNodes = new Set(network.getConnectedNodes(focusedNodeId));
  connectedNodes.add(focusedNodeId);

  const connectedEdges = new Set(network.getConnectedEdges(focusedNodeId));

  const nodeUpdates = [];
  nodesDS.forEach(n => {
    if (connectedNodes.has(n.id)) {
      nodeUpdates.push({
        id: n.id,
        color: n._origColor,
        opacity: 1.0,
        font: { color: '#ffffff' }
      });
    } else {
      nodeUpdates.push({
        id: n.id,
        color: {
          background: 'rgba(50, 60, 80, 0.25)',
          border: 'rgba(70, 80, 100, 0.2)'
        },
        font: { color: 'rgba(100, 116, 139, 0.3)' }
      });
    }
  });
  nodesDS.update(nodeUpdates);

  const edgeUpdates = [];
  edgesDS.forEach(e => {
    if (connectedEdges.has(e.id)) {
      edgeUpdates.push({
        id: e.id,
        color: '#818cf8',
        width: 2.8,
        opacity: 1
      });
    } else {
      edgeUpdates.push({
        id: e.id,
        color: 'rgba(255, 255, 255, 0.04)',
        width: 0.5
      });
    }
  });
  edgesDS.update(edgeUpdates);
}

function resetDimming() {
  const nodeUpdates = [];
  nodesDS.forEach(n => {
    nodeUpdates.push({
      id: n.id,
      color: n._origColor,
      font: { color: '#f8fafc' }
    });
  });
  nodesDS.update(nodeUpdates);

  const edgeUpdates = [];
  edgesDS.forEach(e => {
    edgeUpdates.push({
      id: e.id,
      color: e._origColor,
      width: e._origWidth
    });
  });
  edgesDS.update(edgeUpdates);
}

// Show Node Inspector
function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;

  applyFocusHighlight(nodeId);

  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    return nb ? { id: nid, label: nb.label || nid, color: nb._origColor?.background || '#6366f1' } : null;
  }).filter(Boolean);

  document.getElementById('inspector-badge').textContent = 'ACTIVE';

  let html = '<div class="node-headline">' + esc(n.label) + '</div>';
  const typeClass = (n._file_type === 'concept') ? 'type-concept' : 'type-code';
  html += '<span class="node-type-pill ' + typeClass + '">' + esc(n._file_type || 'code') + '</span>';

  html += '<div class="field-row"><span class="field-label">Community / Cluster</span><div class="field-value" style="color: #a5b4fc;">' + esc(n._community_name) + '</div></div>';

  if (n._source_file) {
    html += '<div class="field-row"><span class="field-label">Source File</span>';
    html += '<div class="file-badge-wrap"><span class="field-value" style="flex:1; font-size:11px;">' + esc(n._source_file) + '</span>';
    html += '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + esc(n._source_file) + '\'); this.textContent=\'✓ Copied\'; setTimeout(()=>this.textContent=\'Copy\', 1500)">Copy</button></div></div>';
  }

  html += '<div class="field-row" style="margin-top:6px;"><span class="field-label">Connected Neighbors (' + neighborItems.length + ')</span>';
  html += '<div id="neighbors-list">';
  neighborItems.forEach(nb => {
    html += '<div class="neighbor-link" onclick="selectNode(\'' + esc(nb.id) + '\')">';
    html += '<span style="width:8px; height:8px; border-radius:50%; background:' + nb.color + '; flex-shrink:0;"></span>';
    html += '<span style="overflow:hidden; text-overflow:ellipsis;">' + esc(nb.label) + '</span>';
    html += '</div>';
  });
  html += '</div></div>';

  document.getElementById('info-content').innerHTML = html;
}

function selectNode(nodeId) {
  network.selectNodes([nodeId]);
  network.focus(nodeId, { scale: 1.2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  showInfo(nodeId);
}

network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else {
    resetFocus();
  }
});

// Build Legend & Dynamic Communities
function buildLegend() {
  const commMap = new Map();
  nodesDS.forEach(n => {
    const cId = n._community !== undefined ? n._community : -1;
    if (!commMap.has(cId)) {
      commMap.set(cId, {
        id: cId,
        label: n._community_name || ('Cluster ' + cId),
        color: n._origColor?.background || '#6366f1',
        count: 0,
        nodes: []
      });
    }
    const item = commMap.get(cId);
    item.count++;
    item.nodes.push(n.id);
  });

  const sortedComms = Array.from(commMap.values()).sort((a, b) => b.count - a.count);
  const legendEl = document.getElementById('legend');
  let html = '';

  sortedComms.forEach(c => {
    html += '<div class="legend-item" id="legend-row-' + c.id + '">';
    html += '<input type="checkbox" class="legend-cb" data-comm="' + c.id + '" checked onchange="toggleCommunity(' + c.id + ', this.checked)">';
    html += '<span class="legend-dot" style="background:' + c.color + '; color:' + c.color + '"></span>';
    html += '<span class="legend-label" onclick="focusCommunity(' + c.id + ')">' + esc(c.label) + '</span>';
    html += '<span class="legend-count">' + c.count + '</span>';
    html += '</div>';
  });

  legendEl.innerHTML = html;
}

const activeComms = new Set();
function initActiveComms() {
  nodesDS.forEach(n => {
    if (n._community !== undefined) activeComms.add(n._community);
  });
}

function toggleCommunity(commId, visible) {
  if (visible) activeComms.add(commId);
  else activeComms.delete(commId);

  const nodeUpdates = [];
  nodesDS.forEach(n => {
    if (n._community === commId) {
      nodeUpdates.push({ id: n.id, hidden: !visible });
    }
  });
  nodesDS.update(nodeUpdates);

  const row = document.getElementById('legend-row-' + commId);
  if (row) row.classList.toggle('dimmed', !visible);
}

function toggleAllCommunities(hideAll) {
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hideAll;
    const cid = parseInt(cb.getAttribute('data-comm'), 10);
    toggleCommunity(cid, !hideAll);
  });
}

function focusCommunity(commId) {
  const commNodes = [];
  nodesDS.forEach(n => {
    if (n._community === commId) commNodes.push(n.id);
  });
  if (commNodes.length > 0) {
    network.fit({ nodes: commNodes, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
  }
}

// Search Autocomplete
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    searchResults.style.display = 'none';
    return;
  }
  const matches = [];
  nodesDS.forEach(n => {
    const l = (n.label || '').toLowerCase();
    const sf = (n._source_file || '').toLowerCase();
    if (l.includes(q) || sf.includes(q)) {
      matches.push(n);
    }
  });

  if (matches.length === 0) {
    searchResults.innerHTML = '<div style="color: var(--text-muted); font-size:11px; padding: 6px;">No matching symbols found</div>';
    searchResults.style.display = 'block';
    return;
  }

  let html = '';
  matches.slice(0, 15).forEach(m => {
    html += '<div class="search-item" onclick="selectNode(\'' + esc(m.id) + '\'); searchResults.style.display=\'none\';">';
    html += '<span style="width:6px; height:6px; border-radius:50%; background:' + (m._origColor?.background || '#6366f1') + ';"></span>';
    html += '<span style="flex:1; overflow:hidden; text-overflow:ellipsis;">' + esc(m.label) + '</span>';
    html += '<span style="font-size:10px; color:var(--text-muted);">' + esc(m._community_name) + '</span>';
    html += '</div>';
  });
  searchResults.innerHTML = html;
  searchResults.style.display = 'block';
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/') {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    fitNetwork();
  } else if (e.key === 'p' || e.key === 'P') {
    togglePhysics();
  } else if (e.key === 'Escape') {
    resetFocus();
  }
});

// Init
initActiveComms();
buildLegend();
</script>
